limit_req_zone $binary_remote_addr zone=api:10m rate=1000r/s;
limit_conn_zone $binary_remote_addr zone=connections:10m;
upstream web { server web:3000; keepalive 32; }
upstream api { server api:4000; keepalive 64; }
server {
 listen 80;
 server_name _;
 server_tokens off;
 client_max_body_size 10m;
 limit_conn connections 2000;
 add_header X-Content-Type-Options nosniff always;
 add_header Referrer-Policy strict-origin-when-cross-origin always;
 location /api/ {
  limit_req zone=api burst=2000 nodelay;
  proxy_pass http://api;
  proxy_http_version 1.1;
  proxy_set_header Connection "";
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_read_timeout 65s;
 }
 location / { proxy_pass http://web; proxy_http_version 1.1; proxy_set_header Host $host; }
}
